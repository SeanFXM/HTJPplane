worker_processes 4;

events {
  worker_connections 1024;
}

http {
  include mime.types;

  default_type  application/octet-stream;

  gzip on;
  gzip_vary on;
  gzip_proxied any;
  gzip_comp_level 5;
  gzip_min_length 1024;
  gzip_types text/plain text/css text/javascript text/xml application/javascript application/json application/manifest+json application/xml application/rss+xml image/svg+xml;

  map $uri $static_asset_cache_control {
    default "no-cache";
    ~^/god-mode/assets/ "public, max-age=31536000, immutable";
  }

  set_real_ip_from        0.0.0.0/0;
  real_ip_recursive       on;
  real_ip_header          X-Forward-For;
  limit_req_zone          $binary_remote_addr zone=mylimit:10m rate=10r/s;

  access_log /dev/stdout;
  error_log /dev/stderr;

  server {
    listen 3000;

    # The deployment proxy owns the public scheme and port. Relative redirects
    # stay correct for both the Railway domain and the custom domain.
    absolute_redirect off;

    # Security headers
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-XSS-Protection "1; mode=block" always;
    # Avoid caching a hard 404 with an immutable lifetime.
    add_header Cache-Control $static_asset_cache_control;

    location = / {
      return 302 /god-mode/;
    }

    location = /god-mode {
      return 308 /god-mode/;
    }

    location ^~ /god-mode/assets/ {
      root /usr/share/nginx/html;
      try_files $uri =404;
    }

    location ^~ /god-mode/ {
      root   /usr/share/nginx/html;
      index  index.html index.htm;
      try_files $uri $uri/ /god-mode/index.html;
    }

    location / {
      return 404;
    }
  }
}
