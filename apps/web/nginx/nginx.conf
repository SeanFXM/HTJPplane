worker_processes 4;

events {
  worker_connections 1024;
}

http {
  include mime.types;

  default_type  application/octet-stream;

  gzip on;
  gzip_vary on;
  gzip_proxied any;
  gzip_comp_level 5;
  gzip_min_length 1024;
  gzip_types text/plain text/css text/javascript text/xml application/javascript application/json application/manifest+json application/xml application/rss+xml image/svg+xml;

  map $uri $static_asset_cache_control {
    default "no-cache";
    ~^/assets/ "public, max-age=31536000, immutable";
    ~^/workbox-[A-Za-z0-9_-]+\.js$ "public, max-age=31536000, immutable";
    /sw.js "no-cache";
  }

  set_real_ip_from        0.0.0.0/0;
  real_ip_recursive       on;
  real_ip_header          X-Forward-For;
  limit_req_zone          $binary_remote_addr zone=mylimit:10m rate=10r/s;

  # Do not persist raw query strings, referrers or user agents.
  access_log off;
  error_log /dev/stderr;

  server {
    listen 3000;

    # Preserve the public origin when this image runs behind a TLS proxy.
    absolute_redirect off;

    # Security headers
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-XSS-Protection "1; mode=block" always;
    # Without `always`, missing hashed bundles are never cached for a year.
    add_header Cache-Control $static_asset_cache_control;

    location ^~ /assets/ {
      root /usr/share/nginx/html;
      try_files $uri =404;
    }

    location ~ ^/workbox-[A-Za-z0-9_-]+\.js$ {
      root /usr/share/nginx/html;
      try_files $uri =404;
    }

    location = /sw.js {
      root /usr/share/nginx/html;
      try_files $uri =404;
    }

    location / {
      root   /usr/share/nginx/html;
      index  index.html index.htm;
      try_files $uri $uri/ /index.html;
    }
  }
}
