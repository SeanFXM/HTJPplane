worker_processes auto;

events {
  worker_connections 1024;
}

http {
  include mime.types;
  default_type application/octet-stream;

  gzip on;
  gzip_vary on;
  gzip_proxied any;
  gzip_comp_level 5;
  gzip_min_length 1024;
  gzip_types text/plain text/css text/javascript text/xml application/javascript application/json application/manifest+json application/xml application/rss+xml image/svg+xml;

  # Vite places content-addressed files under /assets. Cache those forever,
  # while forcing the mutable service worker to revalidate on every visit.
  map $uri $static_asset_cache_control {
    default "no-cache";
    ~^/(?:god-mode/)?assets/ "public, max-age=31536000, immutable";
    ~^/workbox-[A-Za-z0-9_-]+\.js$ "public, max-age=31536000, immutable";
    /sw.js "no-cache";
  }

  # Default Nginx access logs include the raw query string and cannot redact
  # credentials. Application/API middleware owns sanitized request logging.
  access_log off;
  error_log /dev/stderr;

  server {
    listen 3000;

    # Railway terminates TLS before forwarding traffic to this container.
    # Keep redirects relative so Nginx never leaks its internal scheme/port.
    absolute_redirect off;

    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    # Avoid caching a hard 404 with an immutable lifetime.
    add_header Cache-Control $static_asset_cache_control;

    # React Router's admin basename is `/god-mode/`; canonicalize the root so
    # relative navigation and static assets always share that exact prefix.
    location = /god-mode {
      return 308 /god-mode/;
    }

    # Missing bundles must be a hard 404. Returning the SPA shell here hides a
    # stale-deployment problem behind a JavaScript MIME/syntax error.
    location ^~ /god-mode/assets/ {
      root /usr/share/nginx/html;
      try_files $uri =404;
    }

    # The Railway web image contains both static SPAs. Deep admin URLs must
    # fall back to the admin index, never the workspace application's index.
    location ^~ /god-mode/ {
      root /usr/share/nginx/html;
      index index.html;
      try_files $uri $uri/ /god-mode/index.html;
    }

    location ^~ /assets/ {
      root /usr/share/nginx/html;
      try_files $uri =404;
    }

    location ~ ^/workbox-[A-Za-z0-9_-]+\.js$ {
      root /usr/share/nginx/html;
      try_files $uri =404;
    }

    location = /sw.js {
      root /usr/share/nginx/html;
      try_files $uri =404;
    }

    location / {
      root /usr/share/nginx/html;
      index index.html;
      try_files $uri $uri/ /index.html;
    }
  }
}
