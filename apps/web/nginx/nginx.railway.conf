worker_processes auto;

events {
  worker_connections 1024;
}

http {
  include mime.types;
  default_type application/octet-stream;

  access_log /dev/stdout;
  error_log /dev/stderr;

  server {
    listen 3000;

    # Railway terminates TLS before forwarding traffic to this container.
    # Keep redirects relative so Nginx never leaks its internal scheme/port.
    absolute_redirect off;

    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # React Router's admin basename is `/god-mode/`; canonicalize the root so
    # relative navigation and static assets always share that exact prefix.
    location = /god-mode {
      return 308 /god-mode/;
    }

    # The Railway web image contains both static SPAs. Deep admin URLs must
    # fall back to the admin index, never the workspace application's index.
    location ^~ /god-mode/ {
      root /usr/share/nginx/html;
      index index.html;
      try_files $uri $uri/ /god-mode/index.html;
    }

    location / {
      root /usr/share/nginx/html;
      index index.html;
      try_files $uri $uri/ /index.html;
    }
  }
}
