; Plane All-In-One — process supervisor for the single Railway container.
; All program logs stream to the container's stdout/stderr so they show up in
; Railway's log viewer (no log files to manage).
;
; Memory levers (set as Railway env vars):
;   GUNICORN_WORKERS            api web workers           (default 1)
;   CELERY_WORKER_CONCURRENCY   celery worker processes   (default 2)
;   ENABLE_MIGRATOR / ENABLE_WORKER / ENABLE_BEAT / ENABLE_SPACE / ENABLE_LIVE
;                               set to 0 to skip a process you don't use

[supervisord]
user=plane
nodaemon=true
logfile=/dev/null
logfile_maxbytes=0

; Control socket so `supervisorctl status` works inside the container
; (e.g. `railway run --service <svc> -- supervisorctl status`, or docker exec).
[unix_http_server]
file=/app/supervisor.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory=supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///app/supervisor.sock

; --- DB migrations: run once on boot, do not restart on clean exit -----------
[program:migrator]
directory=/app/backend
command=sh -c "[ \"${ENABLE_MIGRATOR:-1}\" = \"0\" ] && exit 0; exec ./bin/docker-entrypoint-migrator.sh"
autostart=true
autorestart=unexpected
startsecs=0
exitcodes=0
priority=10
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0

; --- API (Django / gunicorn) -------------------------------------------------
[program:api]
directory=/app/backend
command=sh -c "./bin/docker-entrypoint-api.sh"
autostart=true
autorestart=true
priority=15
environment=PORT="3004",HOSTNAME="0.0.0.0"
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0

; --- Celery worker (concurrency capped to keep RAM low) ----------------------
[program:worker]
directory=/app/backend
command=sh -c "[ \"${ENABLE_WORKER:-1}\" = \"0\" ] && exit 0; python manage.py wait_for_db && python manage.py wait_for_migrations && exec celery -A plane worker -l info --concurrency=${CELERY_WORKER_CONCURRENCY:-2}"
autostart=true
autorestart=unexpected
priority=20
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0

; --- Celery beat (scheduler) -------------------------------------------------
[program:beat]
directory=/app/backend
command=sh -c "[ \"${ENABLE_BEAT:-1}\" = \"0\" ] && exit 0; exec ./bin/docker-entrypoint-beat.sh"
autostart=true
autorestart=unexpected
priority=20
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0

; --- Space (public share app, SSR). Set ENABLE_SPACE=0 to disable. -----------
[program:space]
directory=/app/space/apps/space
command=sh -c "[ \"${ENABLE_SPACE:-1}\" = \"0\" ] && exit 0; exec npx react-router-serve ./build/server/index.js"
autostart=true
autorestart=unexpected
startretries=2
priority=15
environment=PORT="3002",HOSTNAME="0.0.0.0",NODE_ENV="production"
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0

; --- Live (real-time collaboration). Set ENABLE_LIVE=0 to disable. -----------
[program:live]
directory=/app/live
command=sh -c "[ \"${ENABLE_LIVE:-1}\" = \"0\" ] && exit 0; exec node apps/live"
autostart=true
autorestart=unexpected
startretries=2
priority=15
environment=PORT="3005",HOSTNAME="0.0.0.0",NODE_ENV="production"
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0

; --- Caddy (single public entrypoint, serves web/admin static + proxies) -----
[program:proxy]
directory=/app/proxy
command=sh -c "caddy run --config /app/proxy/Caddyfile --adapter caddyfile"
autostart=true
autorestart=true
priority=25
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0
